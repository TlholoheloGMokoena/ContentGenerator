<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Content Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171f;--mu:#5d6675;--bd:#e3e6ec;--ac:#3550e8;--ac2:#e9edff;--ok:#12805c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1118;--card:#171b25;--tx:#eef0f5;--mu:#9aa3b5;--bd:#2a3040;--ac:#7f95ff;--ac2:#1f2648;--ok:#4fd1a1}}
:root[data-theme="dark"]{--bg:#0e1118;--card:#171b25;--tx:#eef0f5;--mu:#9aa3b5;--bd:#2a3040;--ac:#7f95ff;--ac2:#1f2648;--ok:#4fd1a1}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.55 Inter,system-ui,sans-serif;transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque',Inter,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:flex;min-height:100%}
nav.side{width:232px;flex:none;background:var(--card);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font:700 19px 'Bricolage Grotesque';padding:4px 10px 18px}.logo b{color:var(--ac)}
.nb{display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mu);text-align:left;transition:.2s;font-weight:500}
.nb:hover{background:var(--bg);color:var(--tx);transform:translateX(2px)}.nb[aria-current=page]{background:var(--ac2);color:var(--ac);font-weight:600}
.sp{flex:1}
main{flex:1;min-width:0;padding:24px clamp(16px,3vw,40px) 90px;max-width:1280px;margin:0 auto;width:100%}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.top h1{font-size:clamp(22px,4vw,30px)}.top p{margin:2px 0 0;color:var(--mu)}
.top .g{flex:1;min-width:200px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:90px}label{font-weight:600;font-size:13px;display:block;margin:12px 0 5px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;transition:.15s;min-height:40px}
.btn:hover{transform:scale(1.03);box-shadow:0 4px 12px #0002}.btn:active{transform:scale(.97)}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}[data-theme=dark] .btn.p{color:#0e1118}.btn.big{width:100%;padding:14px;font-size:16px;margin-top:16px}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;transition:.2s;min-width:0}
.card.h:hover{transform:translateY(-3px);box-shadow:0 10px 26px #0000001a}
.card h3{font-size:17px}.card p{color:var(--mu);margin:6px 0}
.badge{display:inline-block;font-size:12px;font-weight:600;background:var(--ac2);color:var(--ac);padding:2px 9px;border-radius:99px;margin:0 4px 4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.stat{font:700 30px 'Bricolage Grotesque'}
.two{display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
h2.s{font-size:19px;margin:28px 0 12px}
.ed{min-height:300px;padding:16px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);overflow-wrap:anywhere}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tb .btn{padding:6px 10px;min-height:34px;font-size:13px}
.fade{animation:in .4s ease both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sk{height:14px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,var(--bd),var(--bg),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 16px;color:var(--mu)}.empty h3{color:var(--tx);margin-bottom:6px}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .9s}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:16px;overflow-x:auto}.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mu);border-bottom:2px solid transparent;font-weight:600}.tabs button[aria-selected=true]{color:var(--ac);border-color:var(--ac)}
.fav{font-size:18px;background:none;border:0;cursor:pointer;transition:transform .2s;color:var(--mu)}.fav.on{color:#e0245e;transform:scale(1.15)}
#toasts{position:fixed;right:16px;bottom:80px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;animation:in .3s both;transition:.3s}.toast.out{opacity:0;transform:translateY(10px)}
.mod{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:60;animation:fo .2s}.mod .card{max-width:460px;width:100%;animation:sc .25s}
@keyframes fo{from{opacity:0}}@keyframes sc{from{opacity:0;transform:scale(.94)}}
.menu{position:relative;display:inline-block}.menu div{position:absolute;top:100%;left:0;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:4px;z-index:5;min-width:190px;box-shadow:0 10px 24px #0003}.menu div button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}.menu div button:hover{background:var(--ac2)}
.mob{display:none}
@media(max-width:1023px){.two{grid-template-columns:1fr}}
@media(max-width:767px){nav.side{display:none}.mob{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);z-index:40;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));justify-content:space-around}
.mob button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;color:var(--mu);min-height:48px;cursor:pointer}.mob button[aria-current=page]{color:var(--ac);font-weight:700}.mob span{display:block;font-size:19px}
.btn{min-height:44px}#toasts{right:12px;left:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app"><nav class="side" id="side" aria-label="Main"></nav><main id="main" tabindex="-1"></main></div>
<nav class="mob" id="mob" aria-label="Mobile"></nav><div id="toasts" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAV=[['dash','🏠','Dashboard'],['gen','✨','Generate'],['prompts','💬','Prompts'],['tpl','📄','Templates'],['hist','🕘','History'],['favs','♥','Favorites'],['set','⚙️','Settings']];
const TYPES=['Blog Post','Social Media','Email','Marketing Copy','Product Description','YouTube Script','TikTok Script','LinkedIn Post','Website Copy','Code','Custom'];
const TONES=['Professional','Casual','Friendly','Persuasive','Educational','Inspirational','Humorous','Formal','Gen Z','Creative'];
const CATS=['Marketing','Social Media','Business','Education','Productivity','Coding','Email','Copywriting','Content Creation','Research','Career','Creative Writing'];
const now=Date.now(),D=86400000;
const seed={
content:[
{id:'c1',title:'10 Social Media Ideas for a New Product Launch',type:'Social Media',tone:'Persuasive',content:'<h2>10 Social Media Ideas for a New Product Launch</h2><ol><li>Countdown stories</li><li>Behind-the-scenes build video</li><li>Founder Q&A live</li><li>Early-access giveaway</li><li>Customer teaser quotes</li></ol><p>Pick two and commit for a full week.</p>',createdAt:now-2*3600e3,favorite:true},
{id:'c2',title:'Professional Follow-Up Email',type:'Email',tone:'Professional',content:'<p>Hi Sam,</p><p>Thanks for your time on Tuesday. I wanted to follow up with the proposal we discussed and answer any questions.</p><p>Would Thursday at 10:00 work for a quick call?</p><p>Best,<br>Geneva</p>',createdAt:now-D,favorite:false},
{id:'c3',title:'LinkedIn Post: AI in the Workplace',type:'LinkedIn Post',tone:'Inspirational',content:'<p>AI will not replace your team. It will replace the tasks your team never wanted.</p><p>Here is how we started small: one repetitive report, one afternoon, one big win.</p>',createdAt:now-3*D,favorite:true},
{id:'c4',title:'5 TikTok Hooks for Gen Z Brands',type:'TikTok Script',tone:'Gen Z',content:'<ul><li>"POV: your brand finally gets the group chat"</li><li>"Nobody told me this was possible"</li><li>"Wait for the plot twist"</li></ul>',createdAt:now-5*D,favorite:false}],
prompts:[
{id:'p1',title:'Create a High-Converting Instagram Caption',category:'Social Media',description:'Generate an engaging caption designed to increase comments and shares.',prompt:'Write a {{tone}} Instagram caption about {{topic}} for {{audience}}. End with a question.',variables:['tone','topic','audience'],tags:['instagram','engagement'],favorite:true},
{id:'p2',title:'Write a High-Converting Sales Email',category:'Email',description:'A short persuasive email with a clear call to action.',prompt:'Write a persuasive sales email about {{topic}} for {{audience}}.',variables:['topic','audience'],tags:['sales','email'],favorite:false},
{id:'p3',title:'Create 10 Viral TikTok Hooks',category:'Content Creation',description:'Scroll-stopping opening lines.',prompt:'Create 10 viral TikTok hooks about {{topic}} in a {{tone}} voice.',variables:['topic','tone'],tags:['tiktok','hooks'],favorite:false},
{id:'p4',title:'Turn This Paragraph into a LinkedIn Post',category:'Career',description:'Reshape rough text into a crisp post.',prompt:'Turn this into a {{tone}} LinkedIn post for {{audience}}: {{topic}}',variables:['tone','audience','topic'],tags:['linkedin'],favorite:false},
{id:'p5',title:'Explain a Technical Concept to a Beginner',category:'Education',description:'Plain-language explanations with analogies.',prompt:'Explain {{topic}} to {{audience}} using an everyday analogy.',variables:['topic','audience'],tags:['learning','coding'],favorite:true},
{id:'p6',title:'Generate a Professional Follow-Up Email',category:'Business',description:'Polite follow-up after a meeting.',prompt:'Write a {{tone}} follow-up email about {{topic}}.',variables:['tone','topic'],tags:['email','meetings'],favorite:false}],
templates:[
{id:'t1',title:'Product Launch',category:'Marketing',description:'Announce something new with urgency.',content:'<h2>Introducing {{topic}}</h2><p>Built for {{audience}}. Available today.</p>',variables:['topic','audience'],favorite:false},
{id:'t2',title:'Sales Email',category:'Marketing',description:'Problem, solution, next step.',content:'<p>Hi there,</p><p>Struggling with {{topic}}? We help {{audience}} fix it fast.</p>',variables:['topic','audience'],favorite:false},
{id:'t3',title:'Instagram Caption',category:'Social Media',description:'Short, warm, with hashtags.',content:'<p>{{topic}} ✨ Tell us your favorite below. #{{audience}}</p>',variables:['topic','audience'],favorite:true},
{id:'t4',title:'Meeting Summary',category:'Business',description:'Decisions and action items.',content:'<h2>Meeting Summary: {{topic}}</h2><ul><li>Decisions</li><li>Action items</li></ul>',variables:['topic'],favorite:false},
{id:'t5',title:'Cover Letter',category:'Career',description:'Concise and confident.',content:'<p>Dear hiring manager,</p><p>I am applying for {{topic}}. I bring experience valued by {{audience}}.</p>',variables:['topic','audience'],favorite:false},
{id:'t6',title:'LinkedIn About Section',category:'Career',description:'Tell your story in 120 words.',content:'<p>I help {{audience}} with {{topic}}.</p>',variables:['topic','audience'],favorite:false}]};
let S;try{S=JSON.parse(localStorage.getItem('cg')||'null')}catch(e){}S=S||{...seed,theme:'system',user:{name:'Geneva',email:'geneva@example.com'},prefs:{tone:'Professional',length:'Medium'},usedPrompts:0};
const save=()=>{try{localStorage.setItem('cg',JSON.stringify(S))}catch(e){}};
// ---- data layer: swap these for a real backend later ----
let SM=null,DLC=null;
if(window.claude){claude.use('sample').then(x=>SM=x).catch(()=>{});claude.use('downloads').then(x=>DLC=x).catch(()=>{})}
async function ask(p){if(SM)return (await SM(p,{cache:false})).text;const r=await fetch('/api/generate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p})});if(!r.ok)throw new Error('x');return (await r.json()).text}
const clean=t=>t.replace(/^\s*```(?:html)?\s*|\s*```\s*$/g,'').trim();
const FMT='Return ONLY an HTML fragment using h2, h3, p, ul, ol, li, strong, em, pre, code tags. No markdown, no code fences around the whole answer, no preamble.';
const API={async generate(f){
 const r=await ask(`You are an expert assistant and writer. Fulfil this request completely and give the actual solution or finished content, not advice about how to do it. If it is a question or problem, solve it and show the answer; if it is code, provide working code in <pre><code> plus a brief explanation.\nContent type: ${f.type}\nRequest: ${f.topic}\nTone: ${f.tone}\nAudience: ${f.audience||'general'}\nLength: ${f.length} (Short ~150 words, Medium ~400, Long ~800)\nLanguage: ${f.language}\nExtra instructions: ${f.extra||'none'}\n${FMT} Start with an h2 title.`);return clean(r)},
 async improve(html,how){const r=await ask(`Edit the following content. Instruction: ${how}. Keep the meaning and formatting.\n${FMT}\n\nCONTENT:\n${html}`);return clean(r)}};
async function saveFile(name,data){if(DLC){try{await DLC.save({filename:name,data});return}catch(e){if(e&&e.code==='cancelled')return}}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=name;a.click()}
// ---- ui helpers ----
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;$('#toasts').append(e);setTimeout(()=>{e.classList.add('out');setTimeout(()=>e.remove(),300)},2200)}
function modal(html,ok,label='Confirm'){const m=document.createElement('div');m.className='mod';m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}<div class="row"><button class="btn p" id="mo">${label}</button><button class="btn" id="mc">Cancel</button></div></div>`;document.body.append(m);const c=()=>{m.style.opacity=0;setTimeout(()=>m.remove(),180)};m.querySelector('#mc').onclick=c;m.querySelector('#mo').onclick=()=>{ok(m);c()};m.querySelector('input,button')?.focus();m.onkeydown=e=>e.key==='Escape'&&c()}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.innerText||d.textContent};
const words=h=>plain(h).trim().split(/\s+/).filter(Boolean).length;
const copy=async h=>{try{await navigator.clipboard.writeText(plain(h))}catch(e){}toast('Copied to clipboard.')};
function dl(item,fmt){const t=plain(item.content),md=item.content.replace(/<h2>(.*?)<\/h2>/g,'## $1\n\n').replace(/<h3>(.*?)<\/h3>/g,'### $1\n\n').replace(/<li>(.*?)<\/li>/g,'- $1\n').replace(/<\/p>/g,'\n\n').replace(/<[^>]+>/g,'');
 if(fmt==='pdf'){const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print PDF.');w.document.write('<title>'+esc(item.title)+'</title><body style="font:16px Georgia;max-width:680px;margin:40px auto">'+item.content);w.document.close();w.print();return}
 saveFile(item.title.replace(/[^\w -]/g,'').slice(0,40)+'.'+(fmt==='md'?'md':'txt'),fmt==='md'?md:t);toast('Download started.')}
const ago=t=>{const h=(Date.now()-t)/3600e3;return h<24?Math.max(1,Math.round(h))+'h ago':Math.round(h/24)+'d ago'};
const empty=(t,p,b,r)=>`<div class="empty fade"><div style="font-size:40px">🌱</div><h3>${t}</h3><p>${p}</p>${b?`<button class="btn p" onclick="go('${r}')">${b}</button>`:''}</div>`;
const heart=(kind,id,on)=>`<button class="fav ${on?'on':''}" aria-pressed="${on}" aria-label="${on?'Remove from':'Add to'} favorites" onclick="fv('${kind}','${id}')">${on?'♥':'♡'}</button>`;
window.fv=(k,id)=>{const x=S[k].find(i=>i.id===id);x.favorite=!x.favorite;save();toast(x.favorite?'Added to favorites.':'Removed from favorites.');render()};
window.del=id=>modal('<h3>Delete this content?</h3><p>This can’t be undone.</p>',()=>{S.content=S.content.filter(c=>c.id!==id);save();toast('Content deleted.');render()},'Delete');
window.openC=id=>{cur=S.content.find(c=>c.id===id);genState={item:cur};go('gen')};
const cCard=c=>`<article class="card h fade"><div class="row" style="margin:0"><span class="badge">${c.type}</span><span style="color:var(--mu);font-size:13px">${ago(c.createdAt)} · ${words(c.content)} words</span><span class="sp"></span>${heart('content',c.id,c.favorite)}</div><h3>${esc(c.title)}</h3><p>${esc(plain(c.content).slice(0,110))}…</p><div class="row"><button class="btn p" onclick="openC('${c.id}')">Open</button><button class="btn" onclick="copy(S.content.find(x=>x.id=='${c.id}').content)">Copy</button><button class="btn" onclick="del('${c.id}')">Delete</button></div></article>`;
const pCard=p=>`<article class="card h fade"><div class="row" style="margin:0"><span class="badge">${p.category}</span><span class="sp"></span>${heart('prompts',p.id,p.favorite)}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><p style="font-size:13px;background:var(--bg);padding:8px;border-radius:8px">${esc(p.prompt)}</p><div>${(p.tags||[]).map(t=>`<span class="badge">#${t}</span>`).join('')}</div><div class="row"><button class="btn p" onclick="usePrompt('${p.id}')">Use Prompt</button><button class="btn" onclick="copy(S.prompts.find(x=>x.id=='${p.id}').prompt)">Copy</button></div></article>`;
const tCard=t=>`<article class="card h fade"><div class="row" style="margin:0"><span class="badge">${t.category}</span><span class="sp"></span>${heart('templates',t.id,t.favorite)}</div><h3>${t.title}</h3><p>${t.description}</p><div style="font-size:13px;background:var(--bg);padding:8px;border-radius:8px;max-height:80px;overflow:hidden">${esc(plain(t.content))}</div><div class="row"><button class="btn p" onclick="useTpl('${t.id}')">Use Template</button></div></article>`;
function fillVars(vars,text,html,label){modal(`<h3>Fill in the details</h3>${vars.map(v=>`<label for="v_${v}">${v}</label><input id="v_${v}" data-v="${v}">`).join('')}`,m=>{let out=text;m.querySelectorAll('[data-v]').forEach(i=>out=out.split('{{'+i.dataset.v+'}}').join(i.value||i.dataset.v));genState={topic:html?'':out,item:html?{title:label,type:'Custom',tone:'Professional',content:out,createdAt:Date.now(),id:'n'+Date.now()}:null};go('gen')},'Continue')}
window.usePrompt=id=>{const p=S.prompts.find(x=>x.id===id);S.usedPrompts++;fillVars(p.variables,p.prompt,false)};
window.useTpl=id=>{const t=S.templates.find(x=>x.id===id);fillVars(t.variables,t.content,true,t.title)};
let cur=null,genState={},route='dash',q='';
window.go=r=>{route=r;render();$('#main').focus();scrollTo(0,0)};
function shell(){const b=(c,mob)=>NAV.map(([r,i,l])=>`<button class="${mob?'':'nb'}" ${r===route?'aria-current="page"':''} onclick="go('${r}')">${mob?`<span>${i}</span>${l.slice(0,9)}`:`<span aria-hidden="true">${i}</span>${l}`}</button>`).join('');
 $('#side').innerHTML=`<div class="logo">Content<b>Gen</b></div>${b()}<div class="sp"></div><button class="nb" onclick="modal('<h3>Help</h3><p>Pick a type on Generate, describe your topic, then edit, save or download the result.</p>',()=>{},'Got it')">❓ Help</button><div class="nb" style="cursor:default">👤 ${esc(S.user.name)}</div>`;
 $('#mob').innerHTML=NAV.filter(n=>n[0]!=='tpl').map(([r,i,l])=>`<button ${r===route?'aria-current="page"':''} onclick="go('${r}')"><span>${i}</span>${l.slice(0,9)}</button>`).join('')}
function header(t,sub){return `<header class="top"><div class="g"><h1>${t}</h1><p>${sub}</p></div><div style="flex:2;min-width:180px;max-width:340px"><input type="search" id="gs" aria-label="Search content, prompts and templates" placeholder="Search everything…" value="${esc(q)}"></div><button class="btn" aria-label="Notifications" onclick="toast('No new notifications.')">🔔</button><button class="btn" aria-label="Toggle theme" onclick="setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')">🌓</button></header>`}
function hook(){const g=$('#gs');if(g)g.oninput=e=>{q=e.target.value;if(route!=='search'&&q){route='search';render();const n=$('#gs');n.focus();n.setSelectionRange(q.length,q.length)}else if(!q){go('dash')}else render(true)}}
const match=(a)=>a.filter(x=>JSON.stringify(x).toLowerCase().includes(q.toLowerCase()));
const V={
dash(){const h=new Date().getHours();return header(`Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(S.user.name)} 👋`,'What would you like to create today?')+
`<div class="grid">${[['Blog Post','📝','Long-form articles with structure.'],['Social Media','📣','Posts tuned to each platform.'],['Email','✉️','Outreach and follow-ups.'],['Marketing Copy','🎯','Ads and landing sections.'],['Code','💻','Snippets with explanations.'],['Custom','🪄','Start from your own prompt.']].map(([t,i,d])=>`<div class="card h fade"><div style="font-size:26px">${i}</div><h3>${t}</h3><p>${d}</p><button class="btn p" onclick="genState={type:'${t}'};go('gen')">Generate</button></div>`).join('')}</div>
<h2 class="s">Usage</h2><div class="grid">${[['Content Generated',S.content.length],['Words Generated',S.content.reduce((a,c)=>a+words(c.content),0)],['Saved Prompts',S.prompts.length],['Favorite Templates',S.templates.filter(t=>t.favorite).length]].map(([l,n])=>`<div class="card"><div class="stat" data-n="${n}">0</div><p>${l}</p></div>`).join('')}</div>
<h2 class="s">Recent content</h2>${S.content.length?`<div class="grid">${S.content.slice(0,4).map(cCard).join('')}</div>`:empty('You haven’t generated anything yet.','Create your first piece of content.','Start Creating','gen')}`},
gen(){const it=genState.item,g=genState;return header('Generate Content','Describe what you need and refine the result.')+`<div class="two"><form class="card" id="gf" novalidate><label for="ty">Content type</label><select id="ty">${TYPES.map(t=>`<option ${t===g.type?'selected':''}>${t}</option>`).join('')}</select><label for="tp">Topic</label><textarea id="tp" placeholder="What would you like to create?">${esc(g.topic||'')}</textarea><div id="er" role="alert" style="color:#c62828;font-size:13px"></div>
<label for="tn">Tone</label><select id="tn">${TONES.map(t=>`<option ${t===S.prefs.tone?'selected':''}>${t}</option>`).join('')}</select><label for="au">Audience</label><input id="au" placeholder="Who is this content for?"><label for="ln">Length</label><select id="ln">${['Short','Medium','Long'].map(t=>`<option ${t===S.prefs.length?'selected':''}>${t}</option>`).join('')}</select><label for="lg">Language</label><select id="lg">${['English','Spanish','French','Portuguese','German','Other'].map(t=>`<option>${t}</option>`).join('')}</select><label for="ex">Additional instructions</label><textarea id="ex" placeholder="Include statistics, keep it conversational, end with a call to action."></textarea><button class="btn p big" id="gb" type="submit">✨ Generate Content</button></form><section class="card" id="out" aria-live="polite">${it?result(it):empty('Your content will appear here','Enter your requirements and generate your first piece of content.')}</section></div>`},
prompts(){const c=window.pc||'All';const l=S.prompts.filter(p=>(c==='All'||p.category===c)&&(!window.ps||JSON.stringify(p).toLowerCase().includes(window.ps.toLowerCase())));return header('Prompt Library','Browse, favorite and build reusable prompts.')+`<div class="row" style="margin:0 0 16px"><input id="ps" style="max-width:260px" aria-label="Filter prompts" placeholder="Filter prompts" value="${esc(window.ps||'')}"><select id="pcat" style="max-width:200px" aria-label="Category"><option>All</option>${CATS.map(x=>`<option ${x===c?'selected':''}>${x}</option>`).join('')}</select><button class="btn p" onclick="builder()">+ New prompt</button></div>${l.length?`<div class="grid">${l.map(pCard).join('')}</div>`:empty('No prompts found','Build your own prompt library.')}`},
tpl(){return header('Templates','Ready-made structures for common content.')+`<div class="grid">${S.templates.map(tCard).join('')}</div>`},
hist(){const s=window.hs||'date',l=[...S.content].sort((a,b)=>s==='date'?b.createdAt-a.createdAt:a.type.localeCompare(b.type));return header('History','Everything you have generated.')+`<div class="row" style="margin:0 0 16px"><label for="hs" style="margin:0">Sort by</label><select id="hs" style="max-width:180px"><option value="date" ${s==='date'?'selected':''}>Date</option><option value="type" ${s==='type'?'selected':''}>Content type</option></select></div>${l.length?`<div class="grid">${l.map(cCard).join('')}</div>`:empty('You haven’t generated anything yet.','Create your first piece of content.','Start Creating','gen')}`},
favs(){const t=window.ft||'content';const l=S[t==='content'?'content':t].filter(x=>x.favorite);return header('Favorites','Your saved content, prompts and templates.')+`<div class="tabs" role="tablist">${['content','prompts','templates'].map(x=>`<button role="tab" aria-selected="${x===t}" onclick="ft='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>${l.length?`<div class="grid">${l.map(t==='content'?cCard:t==='prompts'?pCard:tCard).join('')}</div>`:empty('Your favorites will appear here.','Tap the heart on anything to keep it close.')}`},
search(){const c=match(S.content),p=match(S.prompts),t=match(S.templates);return header('Search results',`${c.length+p.length+t.length} matches`)+(c.length+p.length+t.length?`<div class="grid">${c.map(cCard).join('')}${p.map(pCard).join('')}${t.map(tCard).join('')}</div>`:empty('Nothing found',`No results for “${esc(q)}”. Try a different word.`))},
set(){const th=S.theme;return header('Settings','Manage your profile and preferences.')+`<div class="grid"><div class="card"><h3>Profile</h3><label for="sn">Name</label><input id="sn" value="${esc(S.user.name)}"><label for="se">Email</label><input id="se" type="email" value="${esc(S.user.email)}"><button class="btn p" style="margin-top:12px" id="sp">Save profile</button></div>
<div class="card"><h3>Preferences</h3><label for="pt">Default tone</label><select id="pt">${TONES.map(t=>`<option ${t===S.prefs.tone?'selected':''}>${t}</option>`).join('')}</select><label for="pl">Default length</label><select id="pl">${['Short','Medium','Long'].map(t=>`<option ${t===S.prefs.length?'selected':''}>${t}</option>`).join('')}</select></div>
<div class="card"><h3>Appearance</h3><div class="row">${['light','dark','system'].map(x=>`<button class="btn ${th===x?'p':''}" aria-pressed="${th===x}" onclick="setTheme('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>
<div class="card"><h3>Account</h3><div class="row"><button class="btn" onclick="exp()">Export data</button><button class="btn" onclick="modal('<h3>Delete account?</h3><p>All local data will be erased.</p>',()=>{localStorage.removeItem('cg');location.reload()},'Delete account')">Delete account</button></div></div></div>`}};
function result(it){return `<div class="fade"><div class="row" style="margin:0"><span class="badge">${it.type}</span><span style="color:var(--mu);font-size:13px" id="wc">${words(it.content)} words${it.secs?' · '+it.secs+'s':''}</span></div><h3 style="margin-top:6px">${esc(it.title)}</h3><div class="tb" role="toolbar" aria-label="Actions"><button class="btn" onclick="ex('bold')"><b>B</b></button><button class="btn" onclick="ex('italic')"><i>I</i></button><button class="btn" onclick="ex('formatBlock','h2')">H</button><button class="btn" onclick="ex('insertUnorderedList')">• List</button><button class="btn" onclick="ex('insertOrderedList')">1. List</button><button class="btn" onclick="var u=prompt('Link URL');u&&ex('createLink',u)">Link</button><button class="btn" onclick="ex('undo')">Undo</button><button class="btn" onclick="ex('redo')">Redo</button></div>
<div class="ed" id="ed" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Generated content">${it.content}</div><div class="tb"><button class="btn" id="cp">Copy</button><button class="btn p" id="sv">Save</button><span class="menu"><button class="btn" id="dlb" aria-haspopup="true">Download ▾</button></span><button class="btn" id="rg">Regenerate</button><span class="menu"><button class="btn" id="imb" aria-haspopup="true">Improve ▾</button></span><button class="btn" id="sh">Share</button></div></div>`}
window.ex=(c,v)=>{$('#ed').focus();document.execCommand(c,false,v)};
function menu(btn,items,fn){btn.onclick=e=>{e.stopPropagation();const o=btn.parentNode.querySelector('div');if(o)return o.remove();const d=document.createElement('div');items.forEach(i=>{const b=document.createElement('button');b.textContent=i;b.onclick=()=>fn(i);d.append(b)});btn.parentNode.append(d)}}
document.addEventListener('click',()=>document.querySelectorAll('.menu div').forEach(d=>d.remove()));
function bindGen(){const f=$('#gf');if(!f)return;f.onsubmit=e=>{e.preventDefault();run()};bindRes()}
function bindRes(){const ed=$('#ed');if(!ed)return;const it=()=>({...genState.item,content:ed.innerHTML});
 ed.oninput=()=>$('#wc').textContent=words(ed.innerHTML)+' words';
 $('#cp').onclick=e=>{copy(ed.innerHTML);e.target.textContent='✓ Copied';setTimeout(()=>e.target.textContent='Copy',1200)};
 $('#sv').onclick=()=>{const i=it(),k=S.content.findIndex(c=>c.id===i.id);k<0?S.content.unshift(i):S.content[k]=i;genState.item=i;save();toast('Content saved!')};
 $('#sh').onclick=()=>{navigator.share?navigator.share({title:genState.item.title,text:plain(ed.innerHTML)}).catch(()=>{}):copy(ed.innerHTML)};
 $('#rg').onclick=()=>run();
 menu($('#dlb'),['TXT','Markdown','PDF'],x=>dl(it(),x==='TXT'?'txt':x==='PDF'?'pdf':'md'));
 menu($('#imb'),['Make shorter','Make longer','Make more professional','Make more casual','Fix grammar','Make more persuasive','Simplify','Add examples','Rewrite'],async x=>{ed.style.opacity=.4;try{const h=await API.improve(ed.innerHTML,x);ed.innerHTML=h;$('#wc').textContent=words(h)+' words';toast('Content updated.')}catch(e){toast('Couldn’t update the content. Try again.')}ed.style.opacity=1})}
async function run(){const tp=$('#tp').value.trim(),er=$('#er');if(tp.length<5){er.textContent='Add a topic of at least a few words.';$('#tp').focus();return}er.textContent='';
 const f={type:$('#ty').value,topic:tp,tone:$('#tn').value,audience:$('#au').value,length:$('#ln').value,language:$('#lg').value,extra:$('#ex').value};
 const b=$('#gb');b.disabled=true;const msgs=['Understanding your request','Structuring your content','Refining the wording','Finalizing your content'];let i=0;
 const out=$('#out');out.innerHTML=`<h3 class="dots"><span id="ms">${msgs[0]}</span></h3><div class="bar"><i id="pb"></i></div><div class="sk" style="width:60%"></div><div class="sk"></div><div class="sk"></div><div class="sk" style="width:80%"></div>`;
 requestAnimationFrame(()=>$('#pb').style.width='92%');const iv=setInterval(()=>{i=Math.min(i+1,3);const m=$('#ms');m&&(m.textContent=msgs[i])},700);const t0=Date.now();
 try{const h=await API.generate(f);const tm=h.match(/<h2[^>]*>(.*?)<\/h2>/i);genState.item={id:'n'+Date.now(),title:tm?plain(tm[1]).slice(0,80):tp.slice(0,60),type:f.type,tone:f.tone,audience:f.audience,content:h,createdAt:Date.now(),favorite:false,secs:((Date.now()-t0)/1000).toFixed(1)};out.innerHTML=result(genState.item);bindRes();toast('Content generated successfully.')}
 catch(e){out.innerHTML=`<div class="empty"><h3>Something went wrong.</h3><p>We couldn’t generate your content. Please try again.</p><div class="row" style="justify-content:center"><button class="btn p" id="ta">Try Again</button><button class="btn" id="gb2">Go Back</button></div></div>`;$('#ta').onclick=run;$('#gb2').onclick=()=>go('dash')}
 finally{clearInterval(iv);b.disabled=false}}
window.builder=()=>modal(`<h3>New prompt</h3><label for="bn">Prompt name</label><input id="bn"><label for="bc">Category</label><select id="bc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select><label for="bd">Description</label><input id="bd"><label for="bp">Prompt (use {{variables}})</label><textarea id="bp" placeholder="Write a {{tone}} {{platform}} post about {{topic}} for {{audience}}."></textarea>`,m=>{const g=i=>m.querySelector('#'+i).value.trim(),p=g('bp');if(!g('bn')||!p)return toast('Add a name and a prompt.');S.prompts.unshift({id:'p'+Date.now(),title:g('bn'),category:g('bc'),description:g('bd'),prompt:p,variables:[...new Set([...p.matchAll(/\{\{(\w+)\}\}/g)].map(x=>x[1]))],tags:[],favorite:false});save();toast('Prompt saved.');render()},'Save Prompt');
window.exp=()=>saveFile('content-generator-data.json',JSON.stringify(S,null,2));
window.setTheme=t=>{S.theme=t;save();document.documentElement.dataset.theme=t==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;if(route==='set')render()};
function render(keep){shell();$('#main').innerHTML=V[route]();hook();bindGen();
 document.querySelectorAll('[data-n]').forEach(e=>{const n=+e.dataset.n,t0=performance.now();(function s(t){const p=Math.min(1,(t-t0)/700);e.textContent=Math.round(n*p);p<1&&requestAnimationFrame(s)})(t0)});
 const ps=$('#ps');if(ps)ps.oninput=e=>{window.ps=e.target.value;render();$('#ps').focus()};const pc=$('#pcat');if(pc)pc.onchange=e=>{window.pc=e.target.value;render()};
 const hs=$('#hs');if(hs)hs.onchange=e=>{window.hs=e.target.value;render()};
 const sp=$('#sp');if(sp)sp.onclick=()=>{S.user={name:$('#sn').value||'Geneva',email:$('#se').value};S.prefs={tone:$('#pt').value,length:$('#pl').value};save();toast('Settings saved.');render()};
 const pt=$('#pt');if(pt)pt.onchange=()=>{S.prefs.tone=pt.value;save()};const pl=$('#pl');if(pl)pl.onchange=()=>{S.prefs.length=pl.value;save()}}
setTheme(S.theme);render();
</script></body></html>
